        <div class="row g-4">
            <!-- Coluna Esquerda: Avatar e Painel Admin -->
            <div class="col-md-5 d-flex flex-column align-items-center text-center">
                <div class="avatar-container mb-3">
                    <svg class="bi bi-person-circle" width="120" height="120" fill="currentColor" viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg">
                        <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0" />
                        <path d="M0 8a8 8 0 1 1 16 0A8 8 0 0 0 8 1" fill-rule="evenodd" />
                    </svg>
                </div>

                <!-- Bloco de Modo de Administrador (visível no futuro com chave_adm) -->
                <div id="painelAdmin" class="w-100 border p-3 rounded text-start" style="display: none;">
                    <h5>Modo de administrador</h5>
                    <ul class="list-unstyled mb-0">
                        <li><a href="#" class="text-decoration-none text-light">Relatórios</a></li>
                        <li><a href="#" class="text-decoration-none text-light">Adicionar Fórmula</a></li>
                        <li><a href="#" class="text-decoration-none text-light">Adicionar Matéria</a></li>
                        <li><a href="#" class="text-decoration-none text-light">Etc...</a></li>
                    </ul>
                </div>
            </div>

            <!-- Coluna Direita: Informações do Usuário e Ações -->
            <div class="col-md-7 d-flex flex-column justify-content-between">
                <div class="user-info mb-4">
                    <div class="mb-3">
                        <label class="fw-bold">Nome:</label>
                        <span id="lblNome" class="ms-2">Carregando...</span>
                    </div>

                    <div class="mb-3">
                        <label class="fw-bold">Email:</label>
                        <span id="lblEmail" class="ms-2">Carregando...</span>
                    </div>

                    <div class="mb-3 d-flex align-items-center">
                        <label class="fw-bold me-2">Senha:</label>
                        <span id="lblSenha">••••••••</span>
                    </div>
                </div>

                <div class="user-actions d-flex flex-column gap-2">
                    <button id="btnAlterarSenha" class="btn btn-outline-light w-100">Alterar senha</button>
                    <button id="btnExcluirConta" class="btn btn-outline-danger w-100">Excluir conta</button>
                    <button id="btnSair" class="btn btn-secondary w-100 mt-2">Sair da conta</button>
                </div>
            </div>
        </div>
