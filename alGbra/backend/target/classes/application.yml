server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/algbra?createDatabaseIfNotExist=true
    username: ${USERNAME_DATABASE}
    password: ${PASSWORD_DATABASE}

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: true

    properties:
      hibernate:
        format_sql: true

    defer-datasource-initialization: true

  sql:
    init:
      mode: always